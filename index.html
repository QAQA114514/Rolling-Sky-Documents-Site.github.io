<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLLING SKY DOCUMENT SITE</title>
<style>
@font-face {
    font-family: BigFont;
    src: url('font/bigfont.ttf') format('truetype');
}
@font-face {
    font-family: SenBold;
    src: url('font/sen-bold.ttf') format('truetype');
}
@font-face {
    font-family: SenRegular;
    src: url('font/sen-regular.ttf') format('truetype');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#111;
    color:#fff;
    padding:40px;
    font-family:SenRegular;
    transition: background 0.4s ease;
}

#bg-mask{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:top center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.5s ease;
    z-index:50;
}
#bg-mask::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
}

#home{
    transition: opacity 0.4s ease;
}
#home.hide{
    opacity:0;
    pointer-events:none;
}
.main-title{
    font-family:BigFont;
    font-size:clamp(2.2rem,6vw,4.5rem);
    text-align:left;
    margin-bottom:32px;
    color:#eee;
}

.btn-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    width:60%;
}

.doc-btn{
    font-family:SenBold;
    width:100%;
    padding:22px 28px;
    font-size:1.3rem;
    cursor:pointer;
    background-size:cover;
    background-position:top center;
    transition:0.2s;
    text-align:left;
    color:white;
    border-radius: 16px;
}
.doc-btn:hover{
    filter: brightness(1.15);
    transform: translateY(-2px);
}

#doc-view{
    position:fixed;
    inset:0;
    padding:40px;
    overflow:auto;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.5s ease;
    z-index:100;
}
#doc-view.show{
    opacity:1;
    pointer-events:auto;
}
#doc-content{
    font-family:SenRegular;
    line-height:1.8;
    max-width:900px;
    margin:0 auto;
    font-size:1.05rem;
    white-space: pre-wrap;
    word-break: break-word;
}
.back-btn{
    font-family:SenBold;
    margin-bottom:24px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:#2266cc;
    color:white;
    cursor:pointer;
    font-size:1rem;
    position:relative;
    z-index: 9999;
}
.back-btn:hover{
    background:#3388ff;
}

/* 图文同行，图片无圆角 */
.doc-image-wrap{
    display: inline-block;
    margin: 0 4px;
    vertical-align: middle;
}
.doc-img{
    max-width: 140px;
    max-height: 140px;
    border-radius: 0;
    vertical-align: middle;
}
</style>
</head>
<body>
<div id="bg-mask"></div>

<div id="home">
    <h1 class="main-title">ROLLING SKY DOCUMENT SITE</h1>
    <div class="btn-list" id="btnContainer"></div>
</div>

<div id="doc-view">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <div id="doc-content"></div>
</div>

<script src="./deco.js"></script>
</body>
</html>
